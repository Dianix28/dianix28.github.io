<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NegumiSan y TeamGGGirls</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 40px 18px;

            font-family: Arial, Helvetica, sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at top,
                    rgba(255, 142, 203, 0.9),
                    transparent 35%
                ),
                linear-gradient(
                    145deg,
                    #211137,
                    #59358e,
                    #a9468b
                );
        }

        .pagina {
            width: 100%;
            max-width: 550px;
            margin: auto;
        }

        .seccion {
            margin-bottom: 35px;
            padding: 35px 24px;

            text-align: center;

            background: rgba(255, 255, 255, 0.13);

            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 28px;

            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);

            backdrop-filter: blur(10px);
        }

        .logo {
            width: 155px;
            height: 155px;
            margin-bottom: 15px;

            object-fit: contain;

            background: white;
            border: 5px solid white;
            border-radius: 50%;

            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin-bottom: 8px;
            font-size: 33px;
        }

        .descripcion {
            margin-bottom: 24px;

            color: rgba(255, 255, 255, 0.88);
            font-size: 16px;
            line-height: 1.5;
        }

        .titulo-enlaces {
            margin-bottom: 15px;

            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .enlaces {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .boton {
            width: 100%;
            padding: 15px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            color: #321a4a;
            background: white;

            border: 2px solid transparent;
            border-radius: 17px;

            text-decoration: none;
            font-size: 17px;
            font-weight: bold;

            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);

            transition: 0.2s;
        }

        .boton:hover {
            transform: translateY(-4px);
            border-color: #ff86c5;

            box-shadow: 0 13px 25px rgba(0, 0, 0, 0.3);
        }

        .red {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icono {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            border-radius: 12px;

            font-size: 19px;
            font-weight: bold;
        }

        .instagram {
            background: linear-gradient(
                135deg,
                #833ab4,
                #fd1d1d,
                #fcb045
            );
        }

        .facebook {
            background: #1877f2;
        }

        .tiktok {
            background: #111111;
        }

        .flecha {
            color: #a14d98;
            font-size: 25px;
        }

        .separador {
            width: 75px;
            height: 5px;

            margin: 0 auto 35px;

            background: white;
            border-radius: 20px;

            opacity: 0.75;
        }

        footer {
            padding-bottom: 15px;

            text-align: center;
            font-size: 13px;

            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 14px;
            }

            .seccion {
                padding: 28px 16px;
                border-radius: 23px;
            }

            .logo {
                width: 125px;
                height: 125px;
            }

            h1 {
                font-size: 28px;
            }

            .boton {
                padding: 13px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="pagina">

        <!-- NEGUMISAN -->

        <section class="seccion">

            <img
                src="LOGONEGUMI.png"
                alt="Logo de NegumiSan"
                class="logo"
            >

            <h1>NegumiSan</h1>

            <p class="descripcion">
                Sígueme en mis redes sociales ✨
            </p>

            <p class="titulo-enlaces">
                Mis enlaces
            </p>

            <div class="enlaces">

                <a
                    class="boton"
                    href="https://www.instagram.com/negumi_san/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="red">
                        <span class="icono instagram">IG</span>
                        Instagram
                    </span>

                    <span class="flecha">›</span>
                </a>

                <a
                    class="boton"
                    href="https://www.facebook.com/profile.php?id=61582107253466&amp;mibextid=ZbWKwL"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="red">
                        <span class="icono facebook">f</span>
                        Facebook
                    </span>

                    <span class="flecha">›</span>
                </a>

                <a
                    class="boton"
                    href="https://www.tiktok.com/@negumisan28"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="red">
                        <span class="icono tiktok">♪</span>
                        TikTok
                    </span>

                    <span class="flecha">›</span>
                </a>

            </div>

        </section>

        <div class="separador"></div>

        <!-- TEAMGGGIRLS -->

        <section class="seccion">

            <img
                src="LOGO.png"
                alt="Logo de TeamGGGirls"
                class="logo"
            >

            <h1>TeamGGGirls</h1>

            <p class="descripcion">
                Cosplay, videojuegos, baile y creatividad 💖
            </p>

            <p class="titulo-enlaces">
                Enlaces del team
            </p>

            <div class="enlaces">

                <a
                    class="boton"
                    href="https://www.instagram.com/teamgggirls/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="red">
                        <span class="icono instagram">IG</span>
                        Instagram
                    </span>

                    <span class="flecha">›</span>
                </a>

                <a
                    class="boton"
                    href="https://www.facebook.com/share/1C4qXqLMVB"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="red">
                        <span class="icono facebook">f</span>
                        Facebook
                    </span>

                    <span class="flecha">›</span>
                </a>

                <a
                    class="boton"
                    href="https://www.tiktok.com/@team.gggirls?_r=1&amp;_t=ZS-95D0hFYvKpp"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="red">
                        <span class="icono tiktok">♪</span>
                        TikTok
                    </span>

                    <span class="flecha">›</span>
                </a>

            </div>

        </section>

        <footer>
            © 2026 NegumiSan · TeamGGGirls
        </footer>

    </main>

</body>
</html>
